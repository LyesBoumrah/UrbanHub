name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip            # réutilise les paquets téléchargés d'une exécution à l'autre
          cache-dependency-path: requirements.txt
      # Toutes les dépendances du projet : les tests importent le code (requests, dotenv, pandas...).
      # Chaque membre ajoute les siennes dans SA section de requirements.txt.
      - name: Installation des dépendances
        run: pip install -r requirements.txt
      - name: Lint (flake8)
        run: flake8 .
      - name: Tests (pytest)
        run: pytest -q
