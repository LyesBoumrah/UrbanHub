# UrbanHub — environnement Docker Data Lake 100 % MinIO (images à version figée, jamais :latest)
# Services en parallèle :
#   - minio               : Data Lake S3 (bronze/ brut -> silver/ Parquet -> gold/ JSON métier)
#   - p1-meteo-worker     : Flux Batch parallèle Open-Meteo (5 ans + récent) -> bronze/meteo/ & silver/meteo/
#   - p2-velos-worker     : Flux Streaming parallèle CityBikes (toutes les 3 min) -> bronze/velos/ & silver/velos/
#   - p3-pollution-worker : Flux IoT parallèle OpenAQ v3 (horaire) -> bronze/openaq/ & silver/pollution/
#   - p4-gold-worker      : Agrégation Silver Parquet -> Gold JSON métier (toutes les 3 min) -> gold/
#   - streamlit           : Dashboard interactif (http://localhost:8501)

x-worker-env: &worker-env
  PYTHONPATH: /app
  PYTHONUNBUFFERED: "1"
  STORAGE: minio
  MINIO_ENDPOINT: minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-urbanhub}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
  MINIO_BUCKET_BRONZE: ${MINIO_BUCKET_BRONZE:-bronze}
  MINIO_BUCKET_SILVER: ${MINIO_BUCKET_SILVER:-silver}
  MINIO_BUCKET_GOLD: ${MINIO_BUCKET_GOLD:-gold}
  OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
  FETCH_DURATION: ${FETCH_DURATION:-1 semaine}
  HTTP_USER_AGENT: ${HTTP_USER_AGENT:-UrbanHub-school-project/0.1}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-app-service: &app-service
  image: urbanhub-app:0.1
  build:
    context: .
    dockerfile: Dockerfile
  working_dir: /app
  volumes:
    - .:/app
  depends_on:
    minio:
      condition: service_healthy
  restart: unless-stopped
  environment: *worker-env

services:
  minio:
    # Drop-in replacement open-source de minio/minio (images officielles MinIO retirées de Docker Hub)
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    container_name: urbanhub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-urbanhub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  p1-meteo-worker:
    <<: *app-service
    container_name: urbanhub-p1-meteo
    command: >
      /bin/sh -c "
      python scripts/init_datalake.py &&
      python -m p1_meteo.flow --daily --workers 6
      "

  p2-velos-worker:
    <<: *app-service
    container_name: urbanhub-p2-velos
    command: >
      /bin/sh -c "
      python scripts/init_datalake.py &&
      python -m p2_velos.flow --interval 180
      "

  p3-pollution-worker:
    <<: *app-service
    container_name: urbanhub-p3-pollution
    command: >
      /bin/sh -c "
      python scripts/init_datalake.py &&
      python -m p3_pollution.flow --loop --interval 3600 --workers 4
      "

  p4-gold-worker:
    <<: *app-service
    container_name: urbanhub-p4-gold
    command: >
      /bin/sh -c "
      python scripts/init_datalake.py &&
      python -m p4_croise.flow --loop --interval 180
      "

  streamlit:
    <<: *app-service
    container_name: urbanhub-streamlit
    ports:
      - "8501:8501"
    command: >
      streamlit run dashboard/Accueil.py --server.port=8501 --server.address=0.0.0.0

volumes:
  minio_data:
